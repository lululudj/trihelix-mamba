# A 方案: 超长 OOD 外推极限测试
# baseline 规模 (3.26M), 但 max_T 提升到 1024 以支持 T=300/500 评估
# 训练仍用 T=100, 评估 T=300/500 测真正的长程外推能力

# ========== 任务设定 ==========
task:
  cell_types: 16
  action_dim: 5

# ========== 模型 ==========
model:
  d_model: 256
  n_layers: 2
  bind_heads: 4
  fusion_hidden: 512
  enable_m3: false
  enable_jepa: false
  jepa_weight: 0.3
  max_T: 1024          # 关键: 从 256 提升到 1024, 支持 T=500 评估

# ========== Eagle 校验 ==========
eagle:
  tau_init: 1.0e9
  tau_target: 1.0
  tau_warmup_steps: 2000
  tau_anneal_steps: 10000

# ========== 数据 ==========
data:
  root: ./data_cache
  num_train: 8000
  num_val: 1000
  num_test: 1000
  N_choices: [6, 8, 12]
  K_choices: [4, 8, 12]
  T_choices: [30, 60, 100]
  p_transfer_choices: [0.0, 0.3, 0.6]
  scenario_mix: {random: 0.5, goal_directed: 0.3, adversarial: 0.2}

# ========== 训练 ==========
train:
  batch_size: 4
  max_steps: 50000
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  loss_aux_weight: 0.3
  grad_clip: 1.0
  seed: 0

# ========== 评估 ==========
eval:
  acc_steps: [1, 5, 10, 30, 60, 100]
  ood_T: [30, 60, 100, 150, 300, 500]
  ood_N: [6, 8, 12, 16]
  tau_sweep: [0.5, 1.0, 2.0, 5.0, 1.0e9]
