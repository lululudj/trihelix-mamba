# d=128 对比配置 (避免 d=64 stride 对齐问题)
task:
  cell_types: 16
  action_dim: 5
model:
  d_model: 128
  n_layers: 1
  enable_m3: false
  enable_jepa: false
  jepa_weight: 0.3
eagle:
  tau_init: 1.0e9
  tau_target: 1.0
  tau_warmup_steps: 2000
  tau_anneal_steps: 10000
data:
  root: ./data_cache
train:
  batch_size: 4
  max_steps: 50000
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  loss_aux_weight: 0.3
  grad_clip: 1.0
  seed: 0
eval:
  acc_steps: [1, 5, 10, 30, 60, 100]
  ood_T: [30, 60, 100, 150]
  ood_N: [6, 8, 12, 16]
  tau_sweep: [0.5, 1.0, 2.0, 5.0, 1.0e9]
