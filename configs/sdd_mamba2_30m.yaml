# SDD 真实数据验证配置 (阶段 2 Phase A MVP)
# 模型参数与 matched_mamba2_30m.yaml 完全一致 (零模型改动, 严格控制变量)
# 仅改 data.root 指向 SDD 划分目录
# SDD: N=24 网格, K=8 agent, T=100 训练 / T=150 OOD

# ========== 任务设定 ==========
task:
  cell_types: 16          # C: 空格(0) + agent slot ID(1-12) + 保留(13-15)
  action_dim: 5           # A: 上/下/左/右/停留 (与 GridWorld 一致, SDD 量化位移复用)

# ========== 模型 ==========
model:
  d_model: 768           # 与 matched_mamba2_30m 一致 → ~30M params (9× baseline 3.26M)
  n_layers: 2             # 严格控制变量, 不加深
  bind_heads: 4           # Lite 版用, 此版不读
  fusion_hidden: 1536    # 与 d_model 成比例
  # 阶段 A 开关 (关闭, 只验证纯架构在真实数据上的效果)
  enable_m3: false
  enable_jepa: false
  jepa_weight: 0.3
  max_T: 256              # 训练 T=100 < 256, OOD T=150 < 256, 无需 --extend_max_T
  use_checkpoint: true    # N=24 (N²=576) 比 GridWorld N=12 大 4×, 启梯度检查点防 OOM

# ========== Eagle 校验 (此版无 eagle 属性, 不读) ==========
eagle:
  tau_init: 1.0e9
  tau_target: 1.0
  tau_warmup_steps: 2000
  tau_anneal_steps: 10000

# ========== 数据 ==========
data:
  root: ./data_sdd_split    # ← 唯一改动: SDD 划分目录 (split_dataset 产出 {train,val,test}/)
  num_train: 8000
  num_val: 1000
  num_test: 1000
  N_choices: [24]           # SDD 固定 N=24
  K_choices: [8]            # SDD 固定 K=8
  T_choices: [100]
  p_transfer_choices: [0.0] # SDD 无物品转移
  scenario_mix: {bookstore: 1.0}   # MVP 先单场景

# ========== 训练 ==========
train:
  batch_size: 2           # 30M 在 24G 上 batch=2 最稳 (OOM 则降到 1 或启 use_checkpoint)
  max_steps: 50000         # 实际由 --max_steps 10000 覆盖做 smoke test
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  loss_aux_weight: 0.3
  grad_clip: 1.0
  seed: 0

# ========== 评估 ==========
eval:
  acc_steps: [1, 5, 10, 30, 60, 100]
  ood_T: [150]             # MVP 只跑 T150 (1.5× 训练长度)
  ood_N: [24]
  tau_sweep: [1.0e9]
