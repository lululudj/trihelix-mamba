# 三链 DNA-Mamba2 阶段 A 改造配置（.m3 记忆 + JEPA 预言开启）
# 与 matched_mamba2.yaml 完全对齐，仅开启 enable_m3 / enable_jepa 两个开关
# 训练命令: python train.py --model three_chain_mamba2 --config configs/matched_mamba2_m3.yaml

# ========== 任务设定 ==========
task:
  cell_types: 16          # C: 空格(0) + 智能体ID(1-12) + 物品ID(13-15)
  action_dim: 5           # A: 上/下/左/右/停留

# ========== 模型默认 ==========
model:
  d_model: 256           # 每条链的隐藏维度
  n_layers: 2             # 每条链的 Mamba2 层数
  bind_heads: 4           # CrossAttn 头数(Lite 版用)
  fusion_hidden: 512
  # 阶段 A 开关（全开，启用 .m3 文件存储 + JEPA 辅助 loss）
  enable_m3: true         # .m3 快照文件存储（开 = forward 缓存 chain_states 供 save_m3 用）
  enable_jepa: true       # JEPA 潜空间预测辅助 loss（开 = 接空间链 h_s 算余弦相似度 loss）
  jepa_weight: 0.3        # JEPA loss 权重（跟 B 版 Lite 一致，可调）

# ========== Eagle 校验 (仅 Lite 版有 eagle 属性) ==========
eagle:
  tau_init: 1.0e9         # 训练初期 τ = +∞（关闭校验）
  tau_target: 1.0         # 退火目标
  tau_warmup_steps: 2000  # 退火开始步
  tau_anneal_steps: 10000 # 退火持续步

# ========== 数据 ==========
data:
  root: ./data_cache
  num_train: 8000
  num_val: 1000
  num_test: 1000
  N_choices: [6, 8, 12]
  K_choices: [4, 8, 12]
  T_choices: [30, 60, 100]
  p_transfer_choices: [0.0, 0.3, 0.6]
  scenario_mix: {random: 0.5, goal_directed: 0.3, adversarial: 0.2}

# ========== 训练 ==========
train:
  batch_size: 16          # 与 default 对齐
  max_steps: 50000
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  loss_aux_weight: 0.3    # \hat{S}_t 的 CE 权重
  grad_clip: 1.0
  seed: 0

# ========== 评估 ==========
eval:
  acc_steps: [1, 5, 10, 30, 60, 100]
  ood_T: [30, 60, 100, 150]
  ood_N: [6, 8, 12, 16]
  tau_sweep: [0.5, 1.0, 2.0, 5.0, 1.0e9]
